<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3757d5"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#111827}.sub{font:400 17px Arial,sans-serif;fill:#4b5563}.box{fill:#ffffff;stroke:#d1d5db;stroke-width:2}.head{font:700 19px Arial,sans-serif;fill:#111827}.body{font:400 14px Arial,sans-serif;fill:#4b5563}.num{font:700 16px Arial,sans-serif;fill:#ffffff}.arrow{stroke:#3757d5;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="520" fill="#f8fafc" rx="24"/>
  <text x="70" y="60" class="title">AI Application Security — End-to-End Workflow</text>
  <text x="70" y="92" class="sub">From attack-surface discovery to adversarial testing and remediation-ready reporting</text>

  <g transform="translate(60 150)">
    <rect class="box" x="0" y="0" width="190" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">1</text>
    <text x="20" y="75" class="head">Target &amp; Source</text>
    <text x="20" y="105" class="body">Application URL</text><text x="20" y="128" class="body">Source project</text><text x="20" y="151" class="body">Scan configuration</text>
  </g>
  <path class="arrow" d="M255 240 H315"/>

  <g transform="translate(320 150)">
    <rect class="box" x="0" y="0" width="200" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">2</text>
    <text x="20" y="75" class="head">AI-SBOM</text>
    <text x="20" y="105" class="body">Agents</text><text x="20" y="128" class="body">Models • Tools</text><text x="20" y="151" class="body">APIs • Relationships</text>
  </g>
  <path class="arrow" d="M525 240 H585"/>

  <g transform="translate(590 150)">
    <rect class="box" x="0" y="0" width="210" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">3</text>
    <text x="20" y="75" class="head">Policy + Static</text>
    <text x="20" y="105" class="body">Intended behavior</text><text x="20" y="128" class="body">Structural risk</text><text x="20" y="151" class="body">OWASP / MITRE mapping</text>
  </g>
  <path class="arrow" d="M805 240 H865"/>

  <g transform="translate(870 150)">
    <rect class="box" x="0" y="0" width="210" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">4</text>
    <text x="20" y="75" class="head">Behavior Testing</text>
    <text x="20" y="105" class="body">Allowed topics</text><text x="20" y="128" class="body">Policy boundaries</text><text x="20" y="151" class="body">Live response validation</text>
  </g>
  <path class="arrow" d="M1085 240 H1145"/>

  <g transform="translate(1150 150)">
    <rect class="box" x="0" y="0" width="210" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">5</text>
    <text x="20" y="75" class="head">Red Team</text>
    <text x="20" y="105" class="body">100+ scenarios</text><text x="20" y="128" class="body">Injection • Tool abuse</text><text x="20" y="151" class="body">Data exfiltration</text>
  </g>
  <path class="arrow" d="M1365 240 H1425"/>

  <g transform="translate(1430 150)">
    <rect class="box" x="0" y="0" width="120" height="180" rx="18"/>
    <circle cx="30" cy="30" r="17" fill="#3757d5"/><text x="25" y="36" class="num">6</text>
    <text x="18" y="75" class="head">Report</text>
    <text x="18" y="105" class="body">Fixes</text><text x="18" y="128" class="body">Risk</text><text x="18" y="151" class="body">SARIF/JSON</text>
  </g>

  <rect x="60" y="385" width="1490" height="72" rx="16" fill="#eef2ff"/>
  <text x="86" y="416" class="head">Outcome</text>
  <text x="190" y="416" class="sub">Unified visibility into how the AI application is built, what it is allowed to do, and how it behaves under adversarial pressure.</text>
</svg>
